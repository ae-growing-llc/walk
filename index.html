<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="A&amp;E Walk" />
<title>A&amp;E Growing Daily Walk</title>
<meta name="theme-color" content="#0B2A3A" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --navy: #0B2A3A; --gold: #0F5E55; --bg: #EEF3F0; --card: #ffffff;
    --text: #0B2A3A; --muted: #6b7280; --good: #16a34a; --warn: #b91c1c;
    --line: #e5e7eb; --harvest: #b45309; --photo: #2563eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100%; overflow: hidden; user-select: none;
  }
  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  header { background: var(--navy); color: #fff; padding: 14px 16px 12px; border-bottom: 4px solid #7FA58F; display: flex; align-items: center; gap: 12px; }
  header .logo { width: 38px; height: 42px; flex: none; }
  header .title { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
  header .sub { font-size: 12px; opacity: 0.8; margin-top: 3px; }
  main { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .screen { display: none; flex-direction: column; gap: 14px; }
  .screen.active { display: flex; }
  .card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(15,29,49,0.06); }
  h1 { font-size: 22px; margin: 0 0 8px; color: var(--navy); }
  h2 { font-size: 15px; margin: 4px 0 0; color: var(--muted); font-weight: 600; letter-spacing: 1px; }

  .pin-input {
    width: 100%; font-size: 32px; text-align: center; letter-spacing: 6px;
    padding: 16px; font-weight: 700; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--text); -webkit-appearance: none;
  }
  .pin-input:focus { outline: none; border-color: var(--navy); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 22px 18px; border-radius: 14px;
    font-size: 24px; font-weight: 700; border: none; cursor: pointer;
    font-family: inherit; transition: transform 0.08s ease, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-photo   { background: var(--photo); color: #fff; }
  .btn-harvest { background: var(--harvest); color: #fff; }
  .btn-harvest.done { background: var(--good); }
  .btn-send    { background: var(--gold); color: #fff; }
  .btn-ghost   { background: transparent; color: var(--muted); font-size: 15px; font-weight: 500; padding: 12px; }

  /* Room grid */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile {
    position: relative; aspect-ratio: 1; border-radius: 14px;
    background: #fff; border: 2px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: var(--navy); cursor: pointer;
    font-family: inherit; padding: 0;
  }
  .grid.five { grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .grid.five .tile { font-size: 19px; }
  .tile:active { transform: scale(0.96); }
  .tile .badge { font-size: 12px; font-weight: 700; margin-top: 3px; min-height: 16px; }
  .tile.has-photo { border-color: var(--photo); background: #eff6ff; }
  .tile.has-photo .badge { color: var(--photo); }
  .tile.harvested { border-color: var(--harvest); background: #fff7ed; }
  .tile.harvested .badge { color: var(--harvest); }

  /* Room screen */
  .room-name { font-size: 64px; font-weight: 800; color: var(--navy); text-align: center; letter-spacing: 1px; margin: 0; line-height: 1.1; }
  .room-sub { text-align: center; color: var(--muted); font-size: 15px; margin-top: -8px; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photo-grid:empty { display: none; }
  .photo-tile { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid var(--good); background: #f1f5f9; }
  .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-tile .remove {
    position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(15,29,49,0.85); color: #fff; border: none; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; line-height: 1;
  }
  .bag-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
  .stepper { width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--navy); color: #fff; font-size: 34px; font-weight: 700; line-height: 1; cursor: pointer; font-family: inherit; }
  .stepper:active { transform: scale(0.94); }
  .stepper:disabled { background: #cbd5e1; }
  .bag-num { font-size: 48px; font-weight: 800; color: var(--navy); line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
  .bag-label { color: var(--muted); font-size: 15px; margin-top: 4px; text-align: center; }
  .btn-skip { background: #475569; color: #fff; }
  .btn-skip.done { background: var(--good); }
  .tile.skipped { border-color: #475569; background: #f1f5f9; }
  .tile.skipped .badge { color: #475569; }
  .room-note { background: #fff7ed; border: 2px solid var(--harvest); color: #7c2d12; border-radius: 12px; padding: 12px 14px; font-size: 16px; font-weight: 600; text-align: center; line-height: 1.5; }
  .missed-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .missed-list button { background: #fff; border: 2px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 12px 16px; font-size: 20px; font-weight: 800; font-family: inherit; cursor: pointer; }
  .note { text-align: center; color: var(--muted); font-size: 13px; }
  .status { text-align: center; font-size: 16px; font-weight: 700; color: var(--harvest); min-height: 22px; }

  footer { padding: 10px 16px; background: #fff; border-top: 1px solid var(--line); display: none; }
  footer.show { display: block; }
  footer .btn { padding: 16px; font-size: 20px; }
  .lang-row { display: flex; gap: 8px; }
  .lang-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--navy); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .lang-btn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .room-name.long { font-size: 34px; letter-spacing: 0; }
  .btn-status { background: #0f766e; color: #fff; font-size: 20px; }
  .btn-status.done { background: var(--good); }
</style>
</head>

      harvest: "✂️ 已收割", harvestDone: "✓ 已收割", harvestStatus: "已收割 {d}(再点一次取消)",
      harvestNote: "房间收割了?点「已收割」,然后把白板擦干净。",
      empty: "空房", emptyDone: "✓ 空房(再点一次取消)",
      drying: "正在晾干 · 有产品悬挂", storage: "只有存放 · 没有悬挂",
      bags: "🗑 垃圾袋数", back: "← 返回房间列表",
      bHarv: "已收割", bEmpty: "空房", bDry: "晾干", bStore: "存放",
      building: "正在生成…", photoFail: "有 {n} 张照片没有保存成功,请重拍。",

      downloaded: "文件已下载:{f}。请用邮件发送。"
    }
  };
  let LANG = "en";
  try {
    const q = new URLSearchParams(location.search).get("lang");
    const saved = localStorage.getItem(LANG_KEY);
    if (q === "zh" || q === "en") { LANG = q; localStorage.setItem(LANG_KEY, q); }
    else if (saved === "zh" || saved === "en") LANG = saved;
  } catch (e) {}
  function t(k) { return (T[LANG] && T[LANG][k]) || T.en[k] || k; }
  const pdfRoom = r => r.sec === "dry" ? "Drying Room / Storage" : r.name;

  // ---------- PHOTO STORAGE (IndexedDB) ----------
  const IDB_NAME = "ae_walk_photos_v2";
  const IDB_STORE = "photos";
  let _dbPromise = null;
  function openPhotoDB() {
    if (_dbPromise) return _dbPromise;
    _dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return _dbPromise;
  }
  function idbOp(mode, fn) {
    return openPhotoDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, mode);
      const r = fn(tx.objectStore(IDB_STORE));
      tx.oncomplete = () => resolve(r && r.result);
      tx.onerror = () => reject(tx.error);
    }));
  }
  const idbPut = (key, val) => idbOp("readwrite", s => s.put(val, key));
  const idbGet = key => idbOp("readonly", s => s.get(key));
  const idbDelete = key => idbOp("readwrite", s => s.delete(key));
  const idbClear = () => idbOp("readwrite", s => s.clear());
  const photoKey = (room, id) => `${room}|${id}`;

  // ---------- STATE ----------
  const STORAGE_KEY = "ae_walk_v3";
  function todayISO() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function initState() { return { date: todayISO(), room: null, results: {} }; }
  function loadState() {
    try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function saveState() {
    try {
      const lite = { date: state.date, room: null, results: {} };
      for (const k in state.results) {
        const r = state.results[k];
        lite.results[k] = {
          harvested: !!r.harvested, harvestDate: r.harvestDate || null, bags: r.bags || 0, skipped: !!r.skipped, status: r.status || null,
          images: (r.images || []).map(i => ({ id: i.id, name: i.name }))
        };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lite));
    } catch (e) { console.error("saveState failed", e); }
  }
  let state = loadState();
  // New day = fresh record
  if (!state || state.date !== todayISO()) {
    state = initState();
    idbClear().catch(() => {});
    saveState();
  }
  function resOf(name) {
    if (!state.results[name]) state.results[name] = { harvested: false, harvestDate: null, bags: 0, images: [] };
    return state.results[name];
  }
  function hasEntry(name) {
    const r = state.results[name];
    return !!r && (r.harvested || r.skipped || !!r.status || (r.bags || 0) > 0 || (r.images || []).length > 0);
  }
  function prune(name) { if (!hasEntry(name)) delete state.results[name]; }

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const screens = { home: $("screen-home"), room: $("screen-room"), check: $("screen-check") };
  const missedRooms = () => ROOMS.filter(r => !hasEntry(r.name)).map(r => r.name);
  const footer = $("footer");
  const btnSend = $("btnSend"), sendNote = $("sendNote"), btnReset = $("btnReset");
  const roomName = $("roomName"), roomSub = $("roomSub"), roomStatus = $("roomStatus");
  const photoGrid = $("photoGrid"), btnPhoto = $("btnPhoto"), inputImage = $("inputImage");
  const btnHarvested = $("btnHarvested"), btnBack = $("btnBack");
  const grids = { A: $("gridA"), B: $("gridB"), C: $("gridC") };

  function fmtDateZh(iso) { const [y, m, d] = iso.split("-"); return `${y}年${+m}月${+d}日`; }
  function fmtDate(iso) {
    if (LANG === "zh") return fmtDateZh(iso);
    const [y, m, d] = iso.split("-"); return `${+m}/${+d}/${y}`;
  }

  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
    footer.classList.toggle("show", name === "room");
    document.querySelector("main").scrollTop = 0;
  }

  // ---------- HOME ----------
  function renderHome() {
    Object.values(grids).forEach(g => g.innerHTML = "");
    let rooms = 0, photos = 0, harvests = 0, bagsTotal = 0;
    ROOMS.forEach(r => {
      const res = state.results[r.name];
      const n = res ? (res.images || []).length : 0;
      const hv = !!(res && res.harvested);
      const bg = res ? (res.bags || 0) : 0;
      const b = document.createElement("button");
      const sk = !!(res && res.skipped);
      b.className = "tile" + (hv ? " harvested" : (sk ? " skipped" : ((n || bg || (res && res.status)) ? " has-photo" : "")));
      b.dataset.room = r.name;
      const bits = [];
      if (hv) bits.push(t("bHarv"));
      if (sk) bits.push(t("bEmpty"));
      if (res && res.status) bits.push(t(res.status === "DRYING" ? "bDry" : "bStore"));
      if (n) bits.push(`📷${n}`);
      if (bg) bits.push(`🗑${bg}`);
      const badge = bits.join(" ");
      b.innerHTML = `<span>${r.name}</span><span class="badge">${badge}</span>`;
      grids[r.bldg].appendChild(b);
      if (hv || n || bg || sk || (res && res.status)) rooms++;
      photos += n; bagsTotal += bg; if (hv) harvests++;
    });
    btnSend.disabled = rooms === 0;
    sendNote.textContent = rooms === 0 ? t("none") : t("sumLine").replace("{p}", photos).replace("{h}", harvests).replace("{b}", bagsTotal) +
      "\n" + (ROOMS.length - rooms > 0 ? t("left").replace("{n}", ROOMS.length - rooms) : t("allDone"));
    sendNote.style.whiteSpace = "pre-line";
    btnReset.style.display = rooms === 0 ? "none" : "flex";
  }
  function openRoom(name) { state.room = name; renderRoom(); show("room"); }
  $("missedList").addEventListener("click", e => {
    const t = e.target.closest("button");
    if (t) openRoom(t.dataset.room);
  });
  $("btnCheckBack").addEventListener("click", () => { renderHome(); show("home"); });
  $("btnSendAnyway").addEventListener("click", () => { renderHome(); show("home"); send(true); });
  screens.home.addEventListener("click", e => {
    const t = e.target.closest(".tile");
    if (!t) return;
    state.room = t.dataset.room;
    renderRoom();
    show("room");
  });
  btnReset.addEventListener("click", () => {
    if (!confirm(t("resetQ"))) return;
    idbClear().catch(() => {});
    state = initState();
    saveState();
    renderHome();
  });

  // ---------- ROOM ----------
  function roomDef() { return ROOMS.find(r => r.name === state.room); }
  async function hydrate(name) {
    const res = state.results[name];
    if (!res) return;
    for (const img of res.images || []) {
      if (!img.dataUrl && img.id) {
        try { img.dataUrl = await idbGet(photoKey(name, img.id)); } catch (_) {}
      }
    }
  }
  async function renderRoom() {
    const r = roomDef();
    const isDry = r.sec === "dry";
    roomName.textContent = isDry ? t("dryName") : r.name;
    roomName.classList.toggle("long", isDry);
    roomSub.textContent = t("bldg").replace("{x}", r.bldg) + (isDry ? "" : " · " + t("flower"));
    btnHarvested.style.display = isDry ? "none" : "flex";
    $("btnDrying").style.display = isDry ? "flex" : "none";
    $("btnStorage").style.display = isDry ? "flex" : "none";
    $("roomNote").style.display = isDry ? "none" : "block";
    $("roomNote").textContent = t("harvestNote");
    $("btnSkip").style.display = "flex";
    $("tBags").textContent = t("bags");
    await hydrate(r.name);
    const res = state.results[r.name] || { images: [] };
    const images = (res.images || []).filter(i => i.dataUrl);
    photoGrid.innerHTML = "";
    images.forEach((img, i) => {
      const tile = document.createElement("div");
      tile.className = "photo-tile";
      tile.innerHTML = `<img src="${img.dataUrl}" alt=""><button class="remove" data-id="${img.id}" aria-label="删除">✕</button>`;
      photoGrid.appendChild(tile);
    });
    $("btnSkip").classList.toggle("done", !!res.skipped);
    $("btnSkip").textContent = res.skipped ? t("emptyDone") : t("empty");
    $("btnDrying").classList.toggle("done", res.status === "DRYING");
    $("btnDrying").textContent = (res.status === "DRYING" ? "✓ " : "") + t("drying");
    $("btnStorage").classList.toggle("done", res.status === "STORAGE");
    $("btnStorage").textContent = (res.status === "STORAGE" ? "✓ " : "") + t("storage");
    $("bagNum").textContent = res.bags || 0;
    $("bagsMinus").disabled = !(res.bags > 0);
    const n = (res.images || []).length;
    btnPhoto.disabled = n >= MAX_PHOTOS;
    btnPhoto.textContent = n === 0 ? t("photo") : `${t("photoMore")} (${n}/${MAX_PHOTOS})`;
    if (res.harvested) {
      btnHarvested.classList.add("done");
      btnHarvested.textContent = t("harvestDone");
      roomStatus.textContent = t("harvestStatus").replace("{d}", fmtDate(res.harvestDate || state.date));
    } else {
      btnHarvested.classList.remove("done");
      btnHarvested.textContent = t("harvest");
      roomStatus.textContent = "";
    }
  }

  function compressImage(file, maxDim = 800, quality = 0.55) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = e => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  btnPhoto.addEventListener("click", () => inputImage.click());
  inputImage.addEventListener("change", async e => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const name = state.room;
    const res = resOf(name);
    btnPhoto.disabled = true;
    btnPhoto.textContent = t("processing");
    let failed = 0;
    for (const file of files) {
      if (res.images.length >= MAX_PHOTOS) break;
      try {
        const dataUrl = await compressImage(file);
        const id = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        await idbPut(photoKey(name, id), dataUrl);
        res.images.push({ dataUrl, id, name: `${state.date}_${name}_${res.images.length + 1}.jpg` });
      } catch (err) { console.error("photo save failed", err); failed++; }
    }
    prune(name);
    saveState();
    inputImage.value = "";
    await renderRoom();
    if (failed) alert(t("photoFail").replace("{n}", failed));
  });
  photoGrid.addEventListener("click", e => {
    const btn = e.target.closest(".remove");
    if (!btn) return;
    const name = state.room;
    const res = state.results[name];
    if (!res) return;
    const i = res.images.findIndex(x => x.id === btn.dataset.id);
    if (i < 0) return;
    const removed = res.images.splice(i, 1)[0];
    idbDelete(photoKey(name, removed.id)).catch(() => {});
    prune(name);
    saveState();
    renderRoom();
  });
  btnHarvested.addEventListener("click", () => {
    const name = state.room;
    const res = resOf(name);
    if (res.harvested) { res.harvested = false; res.harvestDate = null; }
    else { res.harvested = true; res.harvestDate = todayISO(); res.skipped = false; }
    prune(name);
    saveState();
    renderRoom();
  });
  $("btnSkip").addEventListener("click", () => {
    const name = state.room;
    const res = resOf(name);
    res.skipped = !res.skipped;
    if (res.skipped) { res.harvested = false; res.harvestDate = null; res.status = null; }
    prune(name);
    saveState();
    renderRoom();
  });
  function bumpBags(d) {
    const name = state.room;
    const res = resOf(name);
    res.bags = Math.max(0, (res.bags || 0) + d);
    prune(name);
    saveState();
    renderRoom();
  }
  $("bagsMinus").addEventListener("click", () => bumpBags(-1));
  $("bagsPlus").addEventListener("click", () => bumpBags(1));
  function setStatus(v) {
    const name = state.room;
    const res = resOf(name);
    res.status = res.status === v ? null : v;
    if (res.status) res.skipped = false;
    prune(name);
    saveState();
    renderRoom();
  }
  $("btnDrying").addEventListener("click", () => setStatus("DRYING"));
  $("btnStorage").addEventListener("click", () => setStatus("STORAGE"));
  btnBack.addEventListener("click", () => { state.room = null; renderHome(); show("home"); });
  btnSend.addEventListener("click", () => send());

  // ---------- PDF (English, for the compliance inbox) ----------
  function getImageDims(dataUrl) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve({ w: 1024, h: 768 });
      img.src = dataUrl;
    });
  }
  function fmtResult(res) {
    const parts = [];
    if (res.harvested) parts.push(`HARVESTED ${res.harvestDate || state.date} · post-harvest cleaning complete`);
    if (res.skipped) parts.push("EMPTY");
    if (res.status === "DRYING") parts.push("DRYING · PRODUCT HANGING");
    if (res.status === "STORAGE") parts.push("STORAGE ONLY · NOTHING HANGING");
    const n = (res.images || []).length;
    if (n) parts.push(`${n} photo(s) attached`);
    return parts.join(" · ") || "-";

  async function buildPDF() {
    if (!window.jspdf || !window.jspdf.jsPDF) throw new Error(t("pdfLib"));
    for (const r of ROOMS) await hydrate(r.name);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const W = 612, H = 792, M = 40;
    function drawHeader(small) {
      doc.setFillColor(11, 42, 58);
      doc.rect(0, 0, W, small ? 36 : 60, "F");
      doc.setFillColor(127, 165, 143);
      doc.rect(0, small ? 36 : 60, W, 3, "F");
      const LH = small ? 24 : 42, LW = LH * 148 / 165;
      try { doc.addImage(LOGO_MARK, "PNG", M, small ? 6 : 9, LW, LH); } catch (e) { console.error("logo failed", e); }
      const TX = M + LW + 10;
      doc.setTextColor(255);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(small ? 12 : 18);
      doc.text("DAILY WALK LOG", TX, small ? 18 : 28);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.text(`${COMPANY} · ${LICENSE} · DEA DCN ${DEA_DCN}`, TX, small ? 30 : 44);
      if (!small) {
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text(state.date, W - M, 28, { align: "right" });
      }
      doc.setTextColor(0);
    }
    drawHeader();
    const body = ROOMS.filter(r => hasEntry(r.name))
      .map(r => [pdfRoom(r), `Bldg ${r.bldg} · ${r.sec === "dry" ? "DRY / STORAGE" : "FLOWER"}`, fmtResult(Object.assign({ _name: r.name }, state.results[r.name])), String(state.results[r.name].bags || 0)]);
    const bagsTotal = ROOMS.reduce((t, r) => t + ((state.results[r.name] || {}).bags || 0), 0);
    body.push(["TOTAL", "", "Non-MMJ waste bags out today", String(bagsTotal)]);
    doc.autoTable({
      head: [["Room", "Building / Type", "Result", "Waste bags"]], body, startY: 76, theme: "striped",
      headStyles: { fillColor: [15, 94, 85], textColor: 255, fontSize: 10, fontStyle: "bold" },
      bodyStyles: { fontSize: 10, cellPadding: 5 },
      margin: { left: M, right: M },
      columnStyles: { 0: { cellWidth: 115, fontStyle: "bold" }, 1: { cellWidth: 125 }, 2: { cellWidth: "auto" }, 3: { cellWidth: 70, halign: "center" } }
    });
    let y = doc.lastAutoTable.finalY + 22;
    const missed = missedRooms();
    doc.setFont("helvetica", "bold"); doc.setFontSize(10);
    if (missed.length) {
      doc.setTextColor(185, 28, 28);
      const lines = doc.splitTextToSize(`ROOMS WITH NO ENTRY (${missed.length}): ${missed.join(", ")}`, W - 2 * M);
      doc.text(lines, M, y); y += lines.length * 13;
    } else {
      doc.setTextColor(22, 163, 74);
      doc.text(`All ${ROOMS.length} rooms have an entry.`, M, y); y += 13;
    }
    doc.setTextColor(0);
    y += 17;
    if (y > H - 80) { doc.addPage(); drawHeader(true); y = 80; }
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(102);
    doc.text("Recorded by:", M, y);
    doc.text(`Date: ${state.date}`, M + 260, y);
    doc.setTextColor(0);

    for (const r of ROOMS) {
      const photos = ((state.results[r.name] || {}).images || []).filter(p => p.dataUrl);
      for (let i = 0; i < photos.length; i++) {
        doc.addPage();
        drawHeader(true);
        doc.setFont("helvetica", "bold"); doc.setFontSize(12);
        doc.text(`Building ${r.bldg} · ${pdfRoom(r)} - photo ${i + 1} of ${photos.length}`, M, 56);
        const dims = await getImageDims(photos[i].dataUrl);
        const availW = W - 2 * M, availH = H - 90 - M;
        let drawW = availW, drawH = drawW * dims.h / dims.w;
        if (drawH > availH) { drawH = availH; drawW = drawH * dims.w / dims.h; }
        try { doc.addImage(photos[i].dataUrl, "JPEG", M + (availW - drawW) / 2, 72, drawW, drawH); }
        catch (e) { console.error("addImage failed", e); }
      }
    }
    const total = doc.internal.getNumberOfPages();
    for (let p = 1; p <= total; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(140);
      doc.text(`Page ${p} of ${total}`, W - M, H - 20, { align: "right" });
      if (SEND_TO) doc.text(`Email to ${SEND_TO}`, M, H - 20);
    }
    return doc.output("blob");
  }

  async function send(force) {
    const missed = missedRooms();
    if (force !== true && missed.length) {
      $("missedList").innerHTML = missed.map(n => `<button data-room="${n}">${n}</button>`).join("");
      show("check");
      return;
    }
    const [y, m, d] = state.date.split("-");
    const subj = `A&E Daily Walk Log – ${m}/${d}/${y}`;
    const filename = `AE_Daily_Walk_Log_${state.date}.pdf`;
    btnSend.disabled = true;
    btnSend.textContent = t("building");
    let blob;
    try { blob = await buildPDF(); }
    catch (err) {
      alert(t("pdfFail") + (err.message || err));
      btnSend.textContent = t("send"); renderHome();
      return;
    }
    const file = new File([blob], filename, { type: "application/pdf" });
    btnSend.textContent = t("send"); renderHome();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ title: subj, text: SEND_TO ? `To: ${SEND_TO}\nSubject: ${subj}` : subj, files: [file] });
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    alert(t("downloaded").replace("{f}", filename));
    window.location.href = `mailto:${SEND_TO}?subject=${encodeURIComponent(subj)}`;
  }

  // ---------- SERVICE WORKER ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(err => console.warn("SW register failed:", err));
      // when a new version takes over, reload once so the phone shows it right away
      let reloaded = false;
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
    });
  }

  // ---------- LANGUAGE SWITCH ----------
  function applyLang() {
    document.documentElement.lang = LANG === "zh" ? "zh-Hans" : "en";
    const set = (id, k) => { $(id).textContent = t(k); };
    set("hdrTitle", "title"); set("tHint", "hint"); set("btnSend", "send"); set("btnReset", "reset");
    set("tMissH", "missH"); set("tMissP", "missP"); set("btnCheckBack", "checkBack"); set("btnSendAnyway", "sendAnyway");
    set("tBags", "bags"); set("btnBack", "back");
    $("headerSub").textContent = `${COMPANY} · ${fmtDate(state.date)}`;
    ["A", "B", "C"].forEach(x => { $("h" + x).textContent = t("bldg").replace("{x}", x) + (x === "C" ? " · " + t("dryName") : " · " + t("flower")); });
    $("langEn").classList.toggle("on", LANG === "en");
    $("langZh").classList.toggle("on", LANG === "zh");
    renderHome();
  }
  function setLang(l) {
    LANG = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    applyLang();
  }
  $("langEn").addEventListener("click", () => setLang("en"));
  $("langZh").addEventListener("click", () => setLang("zh"));

  // ---------- INIT (opens straight to the room grid, no unlock code) ----------
  applyLang();
  show("home");
</script>
